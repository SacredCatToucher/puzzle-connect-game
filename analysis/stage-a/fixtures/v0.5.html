<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>拼圖連連 v0.5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef4ff;font:16px system-ui,-apple-system,sans-serif}main{max-width:520px;margin:auto;padding:18px 16px 48px}h1{margin:5px 0;font-size:26px}.sub,.help{color:#b0c0d6;font-size:13px;line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:#22344f;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:21px}.stat small{font-size:11px;color:#bbcadb}#board{display:grid;gap:3px;aspect-ratio:1;touch-action:none;user-select:none;background:#304966;padding:5px;border-radius:13px}.tile{background:#cbdcf0;border-radius:4px;color:#15243b;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,7vw,34px);font-weight:800;touch-action:none;overflow:hidden;position:relative}.tile.linked{box-shadow:inset 0 0 0 3px #28b98e}.tile.selected{outline:3px solid #ffc76c;outline-offset:-3px}.tile .num{background:#ffffffc9;padding:2px 7px;border-radius:6px}.tile.photo .num{font-size:11px;position:absolute;right:2px;bottom:2px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}button,select,.upload{font:inherit;color:white;background:#2b466b;border:1px solid #55769b;border-radius:11px;padding:11px;cursor:pointer}button.primary{background:#427fe2}.panel{background:#1b2b42;border-radius:13px;padding:13px;margin-top:13px}.panel h2{font-size:16px;margin:0 0 9px}.settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.settings select{padding:7px}.upload{padding:8px;font-size:13px}.upload input{display:none}#status{min-height:26px;color:#87edc0;font-size:14px;margin-top:9px}.version{font-size:12px;color:#c0d2ee}#error{white-space:pre-wrap;color:#ffb6b6;font-size:12px}
</style></head><body><main>
<h1>🧩 拼圖連連 <span class="version">v0.2</span></h1><div class="sub">任意交換 · 自動連結 · 群組移動</div>
<div class="stats"><div class="stat"><small>移動次數</small><b id="moves">0</b></div><div class="stat"><small>連結群組</small><b id="groups">0</b></div><div class="stat"><small>完成度</small><b id="progress">0%</b></div></div>
<div id="board"></div><div id="status" role="status"></div><div id="error"></div>
<div class="controls"><button class="primary" id="new">↻ 新關卡</button><button id="hint">👁 顯示答案</button></div>
<div class="panel"><h2>關卡設定</h2><div class="settings"><label for="size">大小</label><select id="size"><option value="3">3 × 3</option><option value="4">4 × 4</option><option value="5">5 × 5</option><option value="6">6 × 6</option></select><label class="upload">📷 上傳圖片<input id="photo" type="file" accept="image/*"></label><button id="numbers">數字模式</button></div></div>
<div class="panel"><h2>操作方式</h2><div class="help">拖曳一塊拼圖到另一個位置；也可以依序點選來源和目的地。相對位置正確的拼圖會自動連結並一起移動，超出邊界的部分會拆開回填。圖片只在你的手機上處理。</div></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);const el=$("board");let n=3,board=[],moves=0,photo=null,selected=null,start=null,dragging=false;
window.addEventListener("error",e=>{$("error").textContent="執行錯誤："+e.message});
function groups(a){let seen=new Set(),out=[];for(let i=0;i<a.length;i++){if(seen.has(i))continue;let q=[i],g=[];seen.add(i);while(q.length){let p=q.pop();g.push(p);let r=Math.floor(p/n),c=p%n;for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=n||nc>=n)continue;let j=nr*n+nc;if(!seen.has(j)&&Math.floor(a[j]/n)===Math.floor(a[p]/n)+dr&&a[j]%n===a[p]%n+dc){seen.add(j);q.push(j)}}}out.push(g)}return out}
function shuffled(){let a=Array.from({length:n*n},(_,i)=>i);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.every((v,i)=>v===i))[a[0],a[1]]=[a[1],a[0]];return a}
function render(){let gs=groups(board),linked=new Set(gs.filter(g=>g.length>1).flat());el.style.gridTemplateColumns="repeat("+n+",1fr)";el.innerHTML="";board.forEach((v,i)=>{let t=document.createElement("div");t.className="tile"+(linked.has(i)?" linked":"")+(selected===i?" selected":"")+(photo?" photo":"");t.dataset.index=i;if(photo){t.style.backgroundImage='url("'+photo+'")';t.style.backgroundSize=(n*100)+"% "+(n*100)+"%";t.style.backgroundPosition=((v%n)*100/(n-1))+"% "+(Math.floor(v/n)*100/(n-1))+"%"}let s=document.createElement("span");s.className="num";s.textContent=v;t.appendChild(s);el.appendChild(t)});$("moves").textContent=moves;$("groups").textContent=gs.filter(g=>g.length>1).length;$("progress").textContent=Math.round(board.filter((v,i)=>v===i).length/board.length*100)+"%"}
function move(from,to){if(from===to)return;let g=groups(board).find(g=>g.includes(from));if(g.length===1){[board[from],board[to]]=[board[to],board[from]];moves++;selected=null;$("status").textContent=board.every((v,i)=>v===i)?"🎉 完成！共 "+moves+" 次移動":"";render();return}let dr=Math.floor(to/n)-Math.floor(from/n),dc=to%n-from%n;let moved=new Map(),old=new Set(g);for(let p of g){let r=Math.floor(p/n)+dr,c=p%n+dc;if(r>=0&&r<n&&c>=0&&c<n)moved.set(r*n+c,board[p])}let sources=new Set([...moved.values()].map(v=>board.indexOf(v)));let destinations=new Set(moved.keys());let vacated=[...sources].filter(p=>!destinations.has(p)).sort((a,b)=>a-b);let displaced=[...destinations].filter(p=>!sources.has(p)).sort((a,b)=>a-b).map(p=>board[p]);let target=board.slice();for(let [p,v] of moved)target[p]=v;for(let k=0;k<vacated.length;k++)target[vacated[k]]=displaced[k];if(new Set(target).size!==n*n)throw Error("拼圖排列驗證失敗");board=target;moves++;selected=null;$("status").textContent=board.every((v,i)=>v===i)?"🎉 完成！共 "+moves+" 次移動":"";render()}
function reset(){board=shuffled();moves=0;selected=null;$("status").textContent="新關卡開始！";render()}
el.addEventListener("pointerdown",e=>{let t=e.target.closest(".tile");if(!t)return;start={i:+t.dataset.index,x:e.clientX,y:e.clientY,id:e.pointerId};dragging=false});
el.addEventListener("pointermove",e=>{if(start&&e.pointerId===start.id&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>12)dragging=true});
window.addEventListener("pointerup",e=>{if(!start||e.pointerId!==start.id)return;let s=start;start=null;let t=document.elementFromPoint(e.clientX,e.clientY)?.closest(".tile");if(dragging){dragging=false;if(t&&el.contains(t))move(s.i,+t.dataset.index);return}if(selected===null){selected=s.i;$("status").textContent="請選擇目的地";render()}else move(selected,s.i)});
window.addEventListener("pointercancel",()=>{start=null;dragging=false});
$("new").onclick=reset;$("size").onchange=e=>{n=+e.target.value;reset()};$("numbers").onclick=()=>{photo=null;render()};$("photo").onchange=e=>{let f=e.target.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{photo=reader.result;reset()};reader.readAsDataURL(f)};
$("hint").onclick=()=>{$("status").textContent="正確答案：0 到 "+(n*n-1)+"，由左到右、由上到下排列"};
reset();
})();
</script></main></body></html>
